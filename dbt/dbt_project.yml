name: borderless
version: "1.0.0"
config-version: 2
profile: borderless

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # Tiers used for reciprocity and "no advance application" logic.
  free_tier: 4

models:
  borderless:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  borderless:
    +schema: seeds
