[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "borderless-pipeline"
version = "0.1.0"
description = "Extract, load, network metrics and JSON export for the Borderless visa atlas"
authors = [{ name = "Oussama Essalehi" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.6",
    "networkx==3.7",
    "scipy>=1.13",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
borderless = "borderless_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: runs dbt and the full pipeline on fixture data (slower)"]
