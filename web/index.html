<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive world map of visa access between countries, from 2019 to today." />
    <meta name="color-scheme" content="light dark" />
    <title>Borderless — an atlas of visa access</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23256abf'/%3E%3Cpath d='M2 16h28M16 2c5 4 5 24 0 28M16 2c-5 4-5 24 0 28' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip-link" href="#panel" data-i18n="page.skip">Skip to the country panel</a>
    <header class="topbar">
      <div class="brand">
        <h1>Borderless</h1>
        <p class="tagline" data-i18n="page.tagline">an atlas of visa access</p>
      </div>
      <form class="search" role="search" id="search-form" autocomplete="off">
        <label for="search-input" class="visually-hidden" data-i18n="page.searchLabel">Choose a passport</label>
        <input id="search-input" type="search" list="passport-list" placeholder="Choose a passport…" data-i18n-placeholder="page.search" />
        <datalist id="passport-list"></datalist>
      </form>
      <div class="views" role="group" aria-label="Map view" data-i18n-aria="page.viewsLabel" id="view-switch"></div>
      <button type="button" class="icon-button" id="welcome-open" aria-label="About this project">?</button>
      <button type="button" class="icon-button lang-toggle" id="lang-toggle" lang="fr" aria-label="FR, afficher en français">FR</button>
      <button type="button" class="icon-button" id="theme-toggle" aria-label="Switch colour theme"></button>
    </header>

    <main class="layout">
      <section class="map-wrap" aria-label="World map" data-i18n-aria="page.map">
        <div id="map"></div>
        <div id="tooltip" class="tooltip" role="status" aria-live="polite" hidden></div>
        <div id="legend" class="legend"></div>
        <div id="map-status" class="map-status" hidden></div>
      </section>

      <aside id="panel" class="panel" tabindex="-1" aria-label="Details" data-i18n-aria="page.details">
        <nav class="tabs" role="tablist" id="tabs"></nav>
        <div class="tab-body" id="tab-body"></div>
      </aside>
    </main>

    <section id="timeline" class="timeline" aria-label="Snapshot timeline" data-i18n-aria="page.timeline"></section>

    <footer class="disclaimer" id="disclaimer"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
